name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high

      - name: Create CI-only configuration
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://nexus:nexus@127.0.0.1:5432/nexus?schema=public
          REDIS_URL=redis://127.0.0.1:6379
          JWT_SECRET=ci-only-secret-value-not-used-for-deployment
          SCENARIO_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEB_ORIGIN=https://example.test
          EOF

      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
